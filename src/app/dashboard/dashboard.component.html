<div class="dashboard">
    <div class="vertical-flex-container">
        <img [src] = "dashboardImage" alt="Dashboard Image" />
        <p> Welcome {{username}} </p>
        @for (navigation of dashboardNavigations; track $index) {
            <button (click)="dashboardNavigateTo(navigation.link)"> {{navigation.title}} </button>
        }
        <button class="logout"> Logout </button>
    </div>
</div>
